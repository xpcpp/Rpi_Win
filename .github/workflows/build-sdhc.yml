name: build-bcm2836sdhc

# Builds raspberrypi/windows-drivers' bcm2836sdhc (Arasan SDHCI miniport, ACPI\BCM2847)
# for ARM64 with the patches in ./patches applied, signs it with a throw-away
# test certificate and uploads the result as an artifact.
#
# Toolchain: Visual Studio 2022 (on the runner) + Windows SDK/WDK MSI installers for
# Windows 11 25H2 (build 26100.6584) -- the kit Microsoft lists as the supported one for
# VS 2022: https://learn.microsoft.com/windows-hardware/drivers/other-wdk-downloads
# No NuGet.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/**'

env:
  # raspberrypi/windows-drivers commit the patches were written against
  UPSTREAM_SHA: 88ee238c9debecce810d208cac1e5f36add3d2a1
  # Microsoft download links (Learn: "Supported WDK versions", Windows 11 25H2, 26100.6584)
  SDK_URL: https://go.microsoft.com/fwlink/?linkid=2338977
  WDK_URL: https://go.microsoft.com/fwlink/?linkid=2335869
  KIT_BUILD: 10.0.26100.0
  CONFIG: Release
  PLATFORM: ARM64

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write   # needed to publish the ci-latest release
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout raspberrypi/windows-drivers
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/windows-drivers
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream

      - name: Apply patches
        working-directory: upstream
        shell: pwsh
        run: |
          Get-ChildItem ..\patches\*.patch | Sort-Object Name | ForEach-Object {
            Write-Host "Applying $($_.Name)"
            git apply --verbose --whitespace=nowarn $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "patch failed: $($_.Name)" }
          }

      - name: Inspect runner (VS, kits)
        run: |
          $vsw = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vsw -latest -products * -property installationPath
          $ver = & $vsw -latest -products * -property installationVersion
          $inc = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
          $kits = if (Test-Path $inc) { (Get-ChildItem $inc -Directory).Name -join ', ' } else { 'none' }
          $arm = Test-Path "$vs\VC\Tools\MSVC"
          $tc = Test-Path "$vs\MSBuild\Microsoft\VC\v170\Platforms\ARM64\PlatformToolsets\WindowsKernelModeDriver10.0"
          Write-Host "::notice title=runner::VS=$ver at $vs | kits: $kits | WDK toolset present: $tc"

      - name: Install Windows SDK 26100 (if missing)
        run: |
          $inc = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$env:KIT_BUILD\um\windows.h"
          if (Test-Path $inc) { Write-Host "SDK $env:KIT_BUILD already installed"; exit 0 }
          Invoke-WebRequest $env:SDK_URL -OutFile winsdksetup.exe
          $p = Start-Process -FilePath .\winsdksetup.exe -Wait -PassThru -ArgumentList '/quiet','/norestart','/features','OptionId.DesktopCPPx64','OptionId.DesktopCPParm64','OptionId.DesktopCPPx86'
          Write-Host "SDK installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -notin 0,3010) { throw "SDK install failed" }

      - name: Install WDK 26100 (MSI installer)
        run: |
          Invoke-WebRequest $env:WDK_URL -OutFile wdksetup.exe
          $p = Start-Process -FilePath .\wdksetup.exe -Wait -PassThru -ArgumentList '/quiet','/norestart'
          Write-Host "WDK installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -notin 0,3010) { throw "WDK install failed" }
          $km = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$env:KIT_BUILD\km\ntddk.h"
          if (-not (Test-Path $km)) { throw "WDK km headers missing after install" }

      - name: Make sure the WDK Visual Studio extension (toolset) is installed
        run: |
          $vsw = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vsw -latest -products * -property installationPath
          $ts = "$vs\MSBuild\Microsoft\VC\v170\Platforms\ARM64\PlatformToolsets\WindowsKernelModeDriver10.0"
          if (Test-Path $ts) { Write-Host "WDK toolset already registered"; exit 0 }
          $vsix = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Vsix" -Recurse -Filter WDK.vsix -ErrorAction SilentlyContinue |
                  Where-Object FullName -match 'VS2022' | Sort-Object FullName | Select-Object -Last 1
          if (-not $vsix) { throw "WDK.vsix not found" }
          Write-Host "Installing $($vsix.FullName)"
          $inst = & $vsw -latest -products * -property productPath
          $vsixInstaller = Join-Path (Split-Path $inst) 'VSIXInstaller.exe'
          $p = Start-Process -FilePath $vsixInstaller -Wait -PassThru -ArgumentList '/quiet','/admin',"`"$($vsix.FullName)`""
          Write-Host "VSIXInstaller exit code: $($p.ExitCode)"
          if (-not (Test-Path $ts)) { throw "WDK toolset still missing after VSIX install" }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build bcm2836sdhc (ARM64)
        shell: pwsh
        run: |
          $sol = (Resolve-Path upstream\build\bcm2836).Path + '\'
          msbuild upstream\drivers\sd\bcm2836\bcm2836sdhc\bcm2836sdhc.vcxproj `
            /p:Configuration=$env:CONFIG /p:Platform=$env:PLATFORM `
            /p:WindowsTargetPlatformVersion=$env:KIT_BUILD `
            /p:SolutionDir=$sol /p:SignMode=Off /p:EnableInf2cat=false `
            /p:TreatWarningAsError=false /p:RunCodeAnalysis=false `
            /p:ApiValidator_Enable=false /p:EnableInfVerif=false /p:InfVerif_Enable=false `
            /v:m /bl:build.binlog `
            "/flp1:logfile=errors.log;errorsonly;verbosity=quiet" `
            "/flp2:logfile=full.log;verbosity=normal"
          exit $LASTEXITCODE

      - name: Report build errors as annotations
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          function Emit($title, $text) {
            $t = $text -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            Write-Host "::error title=$title::$t"
          }
          if (Test-Path errors.log) {
            $e = Get-Content errors.log -Raw
            if ($e.Length -gt 3800) { $e = $e.Substring(0,3800) }
            Emit 'msbuild-errors' $e
          }

          if (Test-Path full.log) {
            $l = (Get-Content full.log -Tail 45) -join "`n"
            if ($l.Length -gt 3800) { $l = $l.Substring($l.Length-3800) }
            Emit 'msbuild-tail' $l
          }

      - name: Verify the driver binary was produced
        run: |
          $sys = Get-ChildItem upstream\build -Recurse -Filter bcm2836sdhc.sys -ErrorAction SilentlyContinue |
                 Where-Object FullName -match 'ARM64' | Select-Object -First 1
          if (-not $sys) { throw "bcm2836sdhc.sys was not produced (build outcome: ${{ steps.build.outcome }})" }
          Write-Host "Found $($sys.FullName) ($($sys.Length) bytes); build step outcome: ${{ steps.build.outcome }}"

      - name: Collect outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          foreach ($n in 'bcm2836sdhc.sys','bcm2836sdhc.inf','bcm2836sdhc.pdb') {
            $f = Get-ChildItem upstream -Recurse -Filter $n |
                 Where-Object FullName -match 'ARM64' | Select-Object -First 1
            if (-not $f) { throw "missing build output: $n" }
            Copy-Item $f.FullName dist\
          }
          Get-ChildItem dist | Format-Table Name,Length

      - name: Sign (throw-away test certificate) and make catalog
        continue-on-error: true
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject "CN=Rpi_Win CI test signing run $env:GITHUB_RUN_ID" `
            -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(30)

          Export-Certificate -Cert $cert -FilePath dist\rpi_win_ci_signing.cer | Out-Null
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\$env:KIT_BUILD"
          $signtool = "$kits\x64\signtool.exe"
          $inf2cat = "$kits\x86\Inf2Cat.exe"
          if (-not (Test-Path $signtool) -or -not (Test-Path $inf2cat)) { throw "signtool/Inf2Cat not found in $kits" }
          & $signtool sign /fd SHA256 /sha1 $cert.Thumbprint dist\bcm2836sdhc.sys
          $ok = $false
          foreach ($os in '10_NI_ARM64','10_CO_ARM64','10_RS5_ARM64') {
            & $inf2cat /driver:dist /os:$os
            if ($LASTEXITCODE -eq 0) { $ok = $true; Write-Host "catalog OK for $os"; break }
          }

          if (-not $ok) { throw "Inf2Cat failed for all OS tokens" }
          & $signtool sign /fd SHA256 /sha1 $cert.Thumbprint dist\bcm2836sdhc.cat

      - name: Upload driver package
        uses: actions/upload-artifact@v4
        with:
          name: bcm2836sdhc-arm64-run${{ github.run_number }}
          path: dist/
          if-no-files-found: error

      - name: Publish to release "ci-latest" (public iwr download for the Pi)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist\* -DestinationPath bcm2836sdhc-arm64.zip -Force
          gh release delete ci-latest --yes --cleanup-tag
          $global:LASTEXITCODE = 0
          gh release create ci-latest bcm2836sdhc-arm64.zip --prerelease --target ${{ github.sha }} `
            --title "CI latest (run ${{ github.run_number }})" `
            --notes "Built from ${{ github.sha }} by workflow run ${{ github.run_number }}. Use scripts/pi-test.ps1."
          exit $LASTEXITCODE

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-run${{ github.run_number }}
          path: build.binlog
          if-no-files-found: ignore
