name: build-bcm2836sdhc

# Builds raspberrypi/windows-drivers' bcm2836sdhc (Arasan SDHCI miniport, ACPI\BCM2847)
# for ARM64 with the patches in ./patches applied, signs it with a throw-away
# test certificate and uploads the result as an artifact.
#
# NOTE: first draft. Windows driver builds on hosted runners are fiddly; if a step
# fails, send me the log tail of that step and I will fix the workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/**'

env:
  # raspberrypi/windows-drivers commit the patches were written against
  UPSTREAM_SHA: 88ee238c9debecce810d208cac1e5f36add3d2a1
  # WDK NuGet version that targets VS 2022 / MSBuild 17 (28000.x targets VS 2026)
  WDK_NUGET_VERSION: 10.0.26100.2454
  CONFIG: Release
  PLATFORM: ARM64

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout raspberrypi/windows-drivers
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/windows-drivers
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream

      - name: Apply patches
        working-directory: upstream
        run: |
          Get-ChildItem ..\patches\*.patch | Sort-Object Name | ForEach-Object {
            Write-Host "Applying $($_.Name)"
            git apply --verbose --whitespace=nowarn $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "patch failed: $($_.Name)" }
          }

      - name: Restore WDK NuGet packages (pinned version)
        run: |
          $v = $env:WDK_NUGET_VERSION
          $pkgs = @'
          <?xml version="1.0" encoding="utf-8"?>
          <packages>
          <package id="Microsoft.Windows.SDK.CPP" version="__V__" targetFramework="native" />
          <package id="Microsoft.Windows.SDK.CPP.x64" version="__V__" targetFramework="native" />
          <package id="Microsoft.Windows.SDK.CPP.arm64" version="__V__" targetFramework="native" />
          <package id="Microsoft.Windows.WDK.x64" version="__V__" targetFramework="native" />
          <package id="Microsoft.Windows.WDK.arm64" version="__V__" targetFramework="native" />
          </packages>
          '@
          $pkgs.Replace('__V__', $v) | Set-Content -Encoding utf8 packages.config
          $props = @'
          <Project>
          <Import Project="packages\Microsoft.Windows.WDK.x64.__V__\build\native\Microsoft.Windows.WDK.x64.props" Condition="Exists('packages\Microsoft.Windows.WDK.x64.__V__\build\native\Microsoft.Windows.WDK.x64.props') and '$(Platform)' == 'x64'"/>
          <Import Project="packages\Microsoft.Windows.WDK.arm64.__V__\build\native\Microsoft.Windows.WDK.arm64.props" Condition="Exists('packages\Microsoft.Windows.WDK.arm64.__V__\build\native\Microsoft.Windows.WDK.arm64.props') and '$(Platform)' == 'ARM64'"/>
          <Import Project="packages\Microsoft.Windows.SDK.CPP.x64.__V__\build\native\Microsoft.Windows.SDK.cpp.x64.props" Condition="Exists('packages\Microsoft.Windows.SDK.CPP.x64.__V__\build\native\Microsoft.Windows.SDK.cpp.x64.props') and '$(Platform)' == 'x64'"/>
          <Import Project="packages\Microsoft.Windows.SDK.CPP.arm64.__V__\build\native\Microsoft.Windows.SDK.cpp.arm64.props" Condition="Exists('packages\Microsoft.Windows.SDK.CPP.arm64.__V__\build\native\Microsoft.Windows.SDK.cpp.arm64.props') and '$(Platform)' == 'ARM64'"/>
          <Import Project="packages\Microsoft.Windows.SDK.CPP.__V__\build\native\Microsoft.Windows.SDK.cpp.props" Condition="Exists('packages\Microsoft.Windows.SDK.CPP.__V__\build\native\Microsoft.Windows.SDK.cpp.props')"/>
          </Project>
          '@
          $props.Replace('__V__', $v) | Set-Content -Encoding utf8 upstream\Directory.Build.props
          nuget restore packages.config -PackagesDirectory upstream\packages\
          if ($LASTEXITCODE -ne 0) { throw "nuget restore failed" }
          $dlls = Get-ChildItem upstream\packages -Recurse -Filter 'Microsoft.DriverKit.Build.Tasks*.dll' |
                  ForEach-Object { $_.Name } | Sort-Object -Unique
          Write-Host "::notice title=wdk-task-dlls::$($dlls -join ' | ')"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build bcm2836sdhc (ARM64)
        run: |
          $sol = (Resolve-Path upstream\build\bcm2836).Path + '\'
          msbuild upstream\drivers\sd\bcm2836\bcm2836sdhc\bcm2836sdhc.vcxproj `
            /p:Configuration=$env:CONFIG /p:Platform=$env:PLATFORM `
            /p:SolutionDir=$sol /p:SignMode=Off /p:EnableInf2cat=false `
            /p:TreatWarningAsError=false /p:RunCodeAnalysis=false `
            /v:m /bl:build.binlog `
            "/flp1:logfile=errors.log;errorsonly;verbosity=quiet" `
            "/flp2:logfile=full.log;verbosity=normal"
          exit $LASTEXITCODE

      - name: Report build errors as annotations
        if: failure()
        run: |
          function Emit($title, $text) {
            $t = $text -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            Write-Host "::error title=$title::$t"
          }
          $pk = (Get-ChildItem upstream\packages -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ', '
          Emit 'packages' $pk
          if (Test-Path errors.log) {
            $e = Get-Content errors.log -Raw
            if ($e.Length -gt 3800) { $e = $e.Substring(0,3800) }
            Emit 'msbuild-errors' $e
          }
          if (Test-Path full.log) {
            $l = (Get-Content full.log -Tail 45) -join "`n"
            if ($l.Length -gt 3800) { $l = $l.Substring($l.Length-3800) }
            Emit 'msbuild-tail' $l
          }

      - name: Collect outputs
        run: |
          New-Item -ItemType Directory dist | Out-Null
          foreach ($n in 'bcm2836sdhc.sys','bcm2836sdhc.inf','bcm2836sdhc.pdb') {
            $f = Get-ChildItem upstream -Recurse -Filter $n |
                 Where-Object FullName -match 'ARM64' | Select-Object -First 1
            if (-not $f) { throw "missing build output: $n" }
            Copy-Item $f.FullName dist\
          }
          Get-ChildItem dist | Format-Table Name,Length

      - name: Sign (throw-away test certificate) and make catalog
        continue-on-error: true
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject "CN=Rpi_Win CI test signing run $env:GITHUB_RUN_ID" `
            -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(30)
          Export-Certificate -Cert $cert -FilePath dist\rpi_win_ci_signing.cer | Out-Null
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $signtool = Get-ChildItem $kits -Recurse -Filter signtool.exe |
            Where-Object FullName -match '\\x64\\' | Sort-Object FullName | Select-Object -Last 1
          $inf2cat = Get-ChildItem upstream\packages,$kits -Recurse -Filter Inf2Cat.exe `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $signtool -or -not $inf2cat) { throw "signtool/Inf2Cat not found" }
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint dist\bcm2836sdhc.sys
          $ok = $false
          foreach ($os in '10_NI_ARM64','10_CO_ARM64','10_RS5_ARM64') {
            & $inf2cat.FullName /driver:dist /os:$os
            if ($LASTEXITCODE -eq 0) { $ok = $true; Write-Host "catalog OK for $os"; break }
          }
          if (-not $ok) { throw "Inf2Cat failed for all OS tokens" }
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint dist\bcm2836sdhc.cat

      - name: Upload driver package
        uses: actions/upload-artifact@v4
        with:
          name: bcm2836sdhc-arm64-run${{ github.run_number }}
          path: dist/
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-run${{ github.run_number }}
          path: build.binlog
          if-no-files-found: ignore
